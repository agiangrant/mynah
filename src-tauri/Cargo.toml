[package]
name = "mynah"
version = "0.1.0"
description = "Mynah — fast, private, on-device speech to text"
authors = ["Andrew"]
edition = "2021"
rust-version = "1.85"

[lib]
name = "mynah_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png", "macos-private-api", "devtools"] }
tauri-plugin-autostart = "2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "io-util", "sync", "time"] }
tokio-util = "0.7"
reqwest = { version = "0.12", default-features = false, features = ["stream", "rustls-tls", "http2"] }
futures-util = "0.3"
whisper-rs = { version = "0.16", default-features = false, features = ["log_backend"] }
whisper-rs-sys = "0.15"
cpal = "0.18"
enigo = "0.6"
arboard = "3"
sysinfo = "0.39"
anyhow = "1"
thiserror = "2"
log = "0.4"
regex = "1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
parking_lot = "0.12"
crossbeam-channel = "0.5"
num_cpus = "1"
once_cell = "1"

[target.'cfg(target_os = "macos")'.dependencies]
whisper-rs = { version = "0.16", default-features = false, features = ["metal", "log_backend"] }
core-foundation = "0.10"
core-graphics = "0.25"
objc2-core-audio = "0.3"
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-app-kit = "0.3"

[target.'cfg(not(target_os = "macos"))'.dependencies]
rdev = "0.5.3"

[target.'cfg(target_os = "windows")'.dependencies]
whisper-rs = { version = "0.16", default-features = false, features = ["vulkan", "log_backend"] }

[features]
default = []
cuda = ["whisper-rs/cuda"]
vulkan = ["whisper-rs/vulkan"]
openblas = ["whisper-rs/openblas"]

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
