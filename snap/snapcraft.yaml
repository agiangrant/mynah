# Snap recipe. Builds Mynah from source inside the snapcraft environment.
#
#   sudo snap install snapcraft --classic
#   snapcraft                      # produces mynah_<version>_<arch>.snap
#   sudo snap install --dangerous mynah_*.snap
#
# Publishing to the Snap Store is free: register the name once with
# `snapcraft register mynah`, then `snapcraft upload --release=stable mynah_*.snap`,
# or let .github/workflows/packages.yml do it when SNAPCRAFT_STORE_CREDENTIALS is set.
name: mynah
base: core22
version: "0.1.0"
summary: Local speech-to-text for the desktop
description: |
  Hold a key, talk, and the text lands in whatever is focused. Runs whisper.cpp entirely
  on your machine: configurable models, filler-word removal, custom vocabulary, meeting
  detection with autosaved transcripts. Nothing leaves the computer.
  The global shortcut and text insertion use X11 (XRecord / XTest); on a Wayland session
  run Mynah under XWayland or use the toggle button in the app window.
grade: stable
confinement: strict
license: MIT

layout:
  /usr/lib/$CRAFT_ARCH_TRIPLET/webkit2gtk-4.1:
    bind: $SNAP/usr/lib/$CRAFT_ARCH_TRIPLET/webkit2gtk-4.1

apps:
  mynah:
    command: usr/bin/mynah
    desktop: usr/share/applications/Mynah.desktop
    extensions: [gnome]
    plugs:
      - audio-record
      - audio-playback
      - network
      - home
      - unity7

parts:
  build-app:
    plugin: dump
    source: .
    build-snaps:
      - node/20/stable
      - rustup/latest/stable
    build-packages:
      - libwebkit2gtk-4.1-dev
      - build-essential
      - cmake
      - curl
      - wget
      - file
      - pkg-config
      - libxdo-dev
      - libssl-dev
      - libayatana-appindicator3-dev
      - librsvg2-dev
      - libasound2-dev
      - libx11-dev
      - libxi-dev
      - libxtst-dev
      - dpkg
    stage-packages:
      - libwebkit2gtk-4.1-0
      - libayatana-appindicator3-1
      - libasound2
      - libxdo3
      - libxi6
      - libxtst6
      - pulseaudio-utils
    override-build: |
      set -eu
      rustup default stable
      npx --yes pnpm@10 install --frozen-lockfile
      npx --yes pnpm@10 tauri build --bundles deb --ci
      dpkg -x src-tauri/target/release/bundle/deb/*.deb $CRAFT_PART_INSTALL/
      sed -i -e "s|Icon=mynah|Icon=/usr/share/icons/hicolor/32x32/apps/mynah.png|g" \
        $CRAFT_PART_INSTALL/usr/share/applications/Mynah.desktop
